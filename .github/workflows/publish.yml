name: Publish NuGet Package

on:
  workflow_dispatch: # manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Configure GitHub Package Source
      run: dotnet nuget add source --username zacharydf7 --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/zacharydf7/index.json"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Create NuGet package
      run: dotnet pack --no-build --output ./bin/Release
    - name: Publish Nuget to GitHub registry
      run: dotnet nuget push ./bin/Release/*.nupkg -k ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate --no-symbols