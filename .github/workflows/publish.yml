name: Publish NuGet Packages

# Pushing a v* tag publishes the packages built and tested from that commit, then creates a GitHub Release from the
# version's CHANGELOG.md section. The tag must match <VersionPrefix> in src/Directory.Build.props.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml

  release-notes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Take the version's section of the changelog
      # Before publishing, which can't be undone, so a tag pushed before the changelog was finished stops here.
      run: |
        version="${GITHUB_REF_NAME#v}"
        # From the version's heading up to the next release's.
        awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' \
          CHANGELOG.md > notes.md
        if [ ! -s notes.md ]; then
          echo "::error::CHANGELOG.md has no section headed \"## [$version]\"."
          exit 1
        fi
        # The changelog's links are relative to the repository; a release's notes aren't in it.
        sed -i "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/#g" notes.md
    - uses: actions/upload-artifact@v7
      with:
        name: release-notes
        path: notes.md

  publish:
    needs: [ build-and-test, release-notes ]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # for the short-lived nuget.org API key from Trusted Publishing
    steps:
    - name: Download the tested packages
      uses: actions/download-artifact@v8
      with:
        name: nupkg
        path: ./nupkg
    - name: Check the packages match the tag
      run: |
        version="${GITHUB_REF_NAME#v}"
        for id in Resourcefull Resourcefull.SqlServer Resourcefull.InMemory Resourcefull.AspNetCore; do
          if [ ! -f "nupkg/$id.$version.nupkg" ]; then
            echo "::error::$id $version wasn't built. The tag $GITHUB_REF_NAME must match <VersionPrefix> in src/Directory.Build.props."
            exit 1
          fi
        done
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Log in to nuget.org
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Publish to nuget.org
      run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: release-notes
    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file notes.md
