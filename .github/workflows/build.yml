name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch: # manual trigger
  workflow_call: # run by publish.yml before anything is pushed to nuget.org
  schedule:
    # Weekly, so a newly published advisory against a dependency fails the audit without a push. GitHub pauses
    # schedules after 60 days without activity in the repository, so Dependabot's alerts are the backstop.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: |
        dotnet test tests/Resourcefull.Tests.Unit --no-build --configuration Release
        dotnet test tests/Resourcefull.Tests.AspNetCore --no-build --configuration Release
    - name: Create NuGet packages
      run: |
        dotnet pack src/Resourcefull --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.SqlServer --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.InMemory --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.AspNetCore --no-build -c Release --output ./nupkg
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: |
          ./nupkg/*.nupkg
          ./nupkg/*.snupkg

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build the docs site
      # Warnings include broken links and missing API docs, so they fail the build.
      run: |
        dotnet tool restore
        dotnet docfx docfx.json --warningsAsErrors
    - name: Upload the docs site
      uses: actions/upload-artifact@v7
      with:
        name: docs-site
        path: _site

  integration-tests:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Resourcefull(!)Integration1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    env:
      RESOURCEFULL_TEST_SQLSERVER: "Server=127.0.0.1,1433;User Id=sa;Password=Resourcefull(!)Integration1;TrustServerCertificate=True;Encrypt=False"
      RESOURCEFULL_TEST_SQL_READY_TIMEOUT_SECONDS: "120"
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.Integration --no-build --configuration Release

  performance:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Resourcefull(!)Performance1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    env:
      RESOURCEFULL_TEST_SQLSERVER: "Server=127.0.0.1,1433;User Id=sa;Password=Resourcefull(!)Performance1;TrustServerCertificate=True;Encrypt=False"
      RESOURCEFULL_TEST_SQL_READY_TIMEOUT_SECONDS: "120"
      # Fails the build when a scenario regresses past tests/Resourcefull.Tests.Performance/baseline.json.
      RESOURCEFULL_PERF_ENFORCE: "true"
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.Performance --no-build --configuration Release --logger "console;verbosity=detailed"
    - name: Upload the measurements
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: performance-results
        path: tests/Resourcefull.Tests.Performance/bin/Release/net10.0/performance-results.json
