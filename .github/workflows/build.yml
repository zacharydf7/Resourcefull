name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch: # manual trigger
  workflow_call: # run by publish.yml before anything is pushed to nuget.org
  schedule:
    # Weekly, so a newly published advisory against a dependency fails the audit without a push. GitHub pauses
    # schedules after 60 days without activity in the repository, so Dependabot's alerts are the backstop.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Decides what this run tests, to keep CI's cost down. A push or pull request tests what it changed. A weekly run, a
  # manual run or a release (publish.yml runs this workflow from the tag) tests everything, on every version and operating
  # system.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      code: ${{ steps.filter.outputs.code }}
      aspnetcore: ${{ steps.filter.outputs.aspnetcore }}
      sqlserver: ${{ steps.filter.outputs.sqlserver }}
      postgresql: ${{ steps.filter.outputs.postgresql }}
      s3: ${{ steps.filter.outputs.s3 }}
      azureblob: ${{ steps.filter.outputs.azureblob }}
      filesystem: ${{ steps.filter.outputs.filesystem }}
    steps:
    - name: Decide whether to test everything
      id: scope
      run: echo "full=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
      if: steps.scope.outputs.full == 'false'
    - name: See what changed
      id: filter
      if: steps.scope.outputs.full == 'false'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        # With no token it compares through git, not the API. The API needs pull-requests: read, and a called workflow
        # can't have more than its caller grants, so asking for it here would break publish.yml, even though this step
        # doesn't run on a tag.
        token: ""
        # The anchors are what a provider's code and tests also depend on.
        filters: |
          everything: &everything
            - ".github/workflows/build.yml"
            - "Directory.Build.props"
            - "src/Directory.Build.props"
            - "global.json"
            - "src/Resourcefull/**"
            - "src/Resourcefull.Testing/**"
          entity-framework: &entity-framework
            - "src/Shared/EntityFramework/**"
          object-storage: &object-storage
            - "src/Shared/ObjectStorage/**"
          code:
            - *everything
            - "src/**"
            - "tests/**"
            - "samples/**"
            - "Resourcefull.sln"
            - "README.md"
            - "LICENSE"
            - "assets/**"
          aspnetcore:
            - *everything
            - "src/Resourcefull.AspNetCore/**"
            - "src/Resourcefull.InMemory/**"
            - "tests/Resourcefull.Tests.AspNetCore/**"
          sqlserver:
            - *everything
            - *entity-framework
            - "src/Resourcefull.SqlServer/**"
            - "tests/Resourcefull.Tests.Integration/**"
          postgresql:
            - *everything
            - *entity-framework
            - "src/Resourcefull.PostgreSql/**"
            - "tests/Resourcefull.Tests.PostgreSql/**"
          s3:
            - *everything
            - *object-storage
            - "tests/Shared/**"
            - "src/Resourcefull.S3/**"
            - "tests/Resourcefull.Tests.S3/**"
          azureblob:
            - *everything
            - *object-storage
            - "tests/Shared/**"
            - "src/Resourcefull.AzureBlob/**"
            - "tests/Resourcefull.Tests.AzureBlob/**"
          filesystem:
            - *everything
            - *object-storage
            - "src/Resourcefull.FileSystem/**"
            - "tests/Resourcefull.Tests.FileSystem/**"

  # Jobs that restore the whole solution share a NuGet cache. One that restores less stays out of it: the first job to
  # finish fills the cache for all of them, so if that were the smaller job, the rest would download what it left out on
  # every run.
  unit-tests:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/*.csproj"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: |
        dotnet test tests/Resourcefull.Tests.Unit --no-build --configuration Release
        dotnet test tests/Resourcefull.Tests.Sqlite --no-build --configuration Release
    - name: Install tus-js-client, for the resumable upload tests
      if: needs.changes.outputs.full == 'true' || needs.changes.outputs.aspnetcore == 'true'
      run: npm ci --prefix tests/Resourcefull.Tests.AspNetCore/TusClient
    - name: Test ASP.NET Core
      if: needs.changes.outputs.full == 'true' || needs.changes.outputs.aspnetcore == 'true'
      env:
        RESOURCEFULL_TEST_TUS_CLIENT: "1"
      run: dotnet test tests/Resourcefull.Tests.AspNetCore --no-build --configuration Release
    - name: Create NuGet packages
      run: |
        dotnet pack src/Resourcefull --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.SqlServer --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.PostgreSql --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.Sqlite --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.S3 --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.AzureBlob --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.FileSystem --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.InMemory --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.AspNetCore --no-build -c Release --output ./nupkg
        dotnet pack src/Resourcefull.Testing --no-build -c Release --output ./nupkg
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: |
          ./nupkg/*.nupkg
          ./nupkg/*.snupkg

  # On main, docs.yml builds the site as it publishes it, so this is for pull requests and full runs.
  docs:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Build the docs site
      # Warnings include broken links and missing API docs, so they fail the build.
      run: |
        dotnet tool restore
        dotnet docfx docfx.json --warningsAsErrors
    - name: Upload the docs site
      uses: actions/upload-artifact@v7
      with:
        name: docs-site
        path: _site

  integration-tests:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.sqlserver == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SQL Server versions the integration tests cover: the older one only in a full run.
        sqlserver: ${{ fromJson(needs.changes.outputs.full == 'true' && '["2019-latest", "2022-latest"]' || '["2022-latest"]') }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Resourcefull(!)Integration1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    env:
      RESOURCEFULL_TEST_SQLSERVER: "Server=127.0.0.1,1433;User Id=sa;Password=Resourcefull(!)Integration1;TrustServerCertificate=True;Encrypt=False"
      RESOURCEFULL_TEST_SQL_READY_TIMEOUT_SECONDS: "120"
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/*.csproj"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.Integration --no-build --configuration Release

  postgresql-tests:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.postgresql == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The PostgreSQL versions the provider's tests cover: the older one only in a full run.
        postgres: ${{ fromJson(needs.changes.outputs.full == 'true' && '["16", "17"]' || '["17"]') }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: "Resourcefull-Integration1"
        ports:
          - 5432:5432
    env:
      RESOURCEFULL_TEST_POSTGRESQL: "Host=127.0.0.1;Port=5432;Username=postgres;Password=Resourcefull-Integration1"
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/*.csproj"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.PostgreSql --no-build --configuration Release

  s3-tests:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.s3 == 'true'
    runs-on: ubuntu-latest
    env:
      RESOURCEFULL_TEST_S3: "http://127.0.0.1:8333"
    steps:
    - uses: actions/checkout@v7
    # Started here rather than as a service, since a service can't be given the command that turns on S3. SeaweedFS
    # keeps keys as files, so running against it also checks that names with dots and slashes are kept as given.
    - name: Start SeaweedFS
      run: docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs:4.50 server -s3 -dir=/data
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/*.csproj"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.S3 --no-build --configuration Release

  azureblob-tests:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.azureblob == 'true'
    runs-on: ubuntu-latest
    env:
      RESOURCEFULL_TEST_AZUREBLOB: "UseDevelopmentStorage=true"
    steps:
    - uses: actions/checkout@v7
    # Started here rather than as a service, since a service can't be given the command that runs only Blob Storage.
    # --skipApiVersionCheck: Azurite may lag the SDK's newest API version, and would otherwise refuse its requests.
    - name: Start Azurite
      run: docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/*.csproj"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.AzureBlob --no-build --configuration Release

  filesystem-tests:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.filesystem == 'true'
    # Filesystems differ in what they take in a name, whether they ignore case or Unicode normalization, and how they
    # lock files, so a full run tests the provider on each. Other runs stay on Linux, since Windows and macOS minutes cost
    # the most.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.changes.outputs.full == 'true' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Build
      run: dotnet build tests/Resourcefull.Tests.FileSystem --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.FileSystem --no-build --configuration Release

  # Only in a full run, since it's one of the longest jobs.
  performance:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    services:
      sqlserver:
        # Pinned, unlike the integration tests', so a new SQL Server release can't move the measurements: moving to one
        # comes with a new baseline.
        image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Resourcefull(!)Performance1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    env:
      RESOURCEFULL_TEST_SQLSERVER: "Server=127.0.0.1,1433;User Id=sa;Password=Resourcefull(!)Performance1;TrustServerCertificate=True;Encrypt=False"
      RESOURCEFULL_TEST_SQL_READY_TIMEOUT_SECONDS: "120"
      # Fails the build when a scenario regresses past tests/Resourcefull.Tests.Performance/baseline.json.
      RESOURCEFULL_PERF_ENFORCE: "true"
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/*.csproj"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test tests/Resourcefull.Tests.Performance --no-build --configuration Release --logger "console;verbosity=detailed"
    - name: Upload the measurements
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: performance-results
        path: tests/Resourcefull.Tests.Performance/bin/Release/net10.0/performance-results.json
