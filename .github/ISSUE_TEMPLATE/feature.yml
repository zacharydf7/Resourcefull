name: Feature request
description: Something Resourcefull could do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem you're solving, rather than the solution you have in mind, so other ways to solve it can be weighed too.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work, if you have an idea, and what you do today instead.
